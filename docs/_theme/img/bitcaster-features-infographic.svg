<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Bitcaster Features Infographic</title>
  <desc id="desc">Infographic highlighting Bitcaster key characteristics: unified API ingestion, intelligent routing, template rendering, user preferences, governance, and scalable delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 24px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .card-title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .card-text { font: 400 22px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .footer { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="70" y="70" width="1260" height="120" rx="20" fill="#111827" stroke="url(#accent)" stroke-width="3"/>
  <text x="110" y="145" class="title">Bitcaster</text>
  <text x="110" y="185" class="subtitle">System-to-user notification hub for modern organisations</text>

  <g transform="translate(70,240)">
    <rect x="0" y="0" width="390" height="180" rx="18" fill="#1f2937" stroke="#334155" stroke-width="2"/>
    <text x="28" y="56" class="card-title">Unified API</text>
    <text x="28" y="95" class="card-text">Single REST endpoint</text>
    <text x="28" y="128" class="card-text">for all notification</text>
    <text x="28" y="161" class="card-text">workflows.</text>

    <rect x="435" y="0" width="390" height="180" rx="18" fill="#1f2937" stroke="#334155" stroke-width="2"/>
    <text x="463" y="56" class="card-title">Smart Routing</text>
    <text x="463" y="95" class="card-text">Payload and context</text>
    <text x="463" y="128" class="card-text">rules route events</text>
    <text x="463" y="161" class="card-text">to the right audience.</text>

    <rect x="870" y="0" width="390" height="180" rx="18" fill="#1f2937" stroke="#334155" stroke-width="2"/>
    <text x="898" y="56" class="card-title">Rich Templates</text>
    <text x="898" y="95" class="card-text">Text, HTML, and</text>
    <text x="898" y="128" class="card-text">Markdown rendering</text>
    <text x="898" y="161" class="card-text">with dynamic data.</text>

    <rect x="0" y="220" width="390" height="180" rx="18" fill="#1f2937" stroke="#334155" stroke-width="2"/>
    <text x="28" y="276" class="card-title">Omnichannel</text>
    <text x="28" y="315" class="card-text">Email, SMS, Slack,</text>
    <text x="28" y="348" class="card-text">Teams, and WebPush</text>
    <text x="28" y="381" class="card-text">from one platform.</text>

    <rect x="435" y="220" width="390" height="180" rx="18" fill="#1f2937" stroke="#334155" stroke-width="2"/>
    <text x="463" y="276" class="card-title">User Preferences</text>
    <text x="463" y="315" class="card-text">Receivers choose</text>
    <text x="463" y="348" class="card-text">where and how they</text>
    <text x="463" y="381" class="card-text">want alerts.</text>

    <rect x="870" y="220" width="390" height="180" rx="18" fill="#1f2937" stroke="#334155" stroke-width="2"/>
    <text x="898" y="276" class="card-title">Enterprise Ready</text>
    <text x="898" y="315" class="card-text">Multi-tenancy, audit</text>
    <text x="898" y="348" class="card-text">history, governance,</text>
    <text x="898" y="381" class="card-text">and scalable workers.</text>
  </g>

  <rect x="70" y="790" width="1260" height="55" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="100" y="825" class="footer">Signal in → Context-aware processing → Personalised message out</text>
</svg>
