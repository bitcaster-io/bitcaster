target-version = "py312"
line-length = 120

[lint.isort]
case-sensitive = true

[lint]
select = [
    "A", # prevent using keywords that clobber python builtins
#    "ANN", # flake8 annotations
    "B", # bugbear: security warnings
    "BLE", # blind exceptions
    "C4", # flake8-comprehensions
    "C90", # McCabe complexity
    "COM", # flake8-commas
    "D", # pydocstyle
    "DJ", # flake8-django
    "E", # pycodestylex
    "E4", "E7", "E9",
    "ERA", # eradicate
    "F", # pyflakes
    "FLY", # flynt
    "FURB", # refurb
    "I", # isort
    "ICN", # flake8-import-conventions
    "ISC", # implicit string concatenation
    "N", # Pep* naming
    "PERF", # perflint
    "PIE", # flake8-pie
    "PL", # PyLint
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "R", # PyLint Refactor
    "RET", # flake8-return
    "S", # bandit,
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "TC", # flake8-type-checking
    "UP", # pyupgrade
    "W", # pycodestyle warnings
    "YTT", # flake8 2020
]
extend-select = ["UP", ]
ignore = [
#    "ANN401",
#    "B904",  # raise-without-from-inside-except: syntax not compatible with py2
    "COM812",
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", #  Missing docstring in public method
    "D103", #  Missing docstring in public function
    "D104", #  Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in `__init__`
    "D203", # one-blank-line-before-class
    "D212", # multi-line-summary-first-line
    "D213", # multi-line-summary-second-line
    "E731",  # lambda-assignment: lambdas are substential in maintenance of py2/3 codebase
    "ISC001",  # conflicts with ruff format command
    "RUF005",  # collection-literal-concatenation: syntax not compatible with py2
    "RUF012", # mutable-class-default: typing is not available for py2
    "I001", # unsorted imports https://docs.astral.sh/ruff/rules/unsorted-imports/#unsorted-imports-i001
    "UP037", # [*] Remove quotes from type annotation
    "UP035", # Import from `collections.abc` instead: `Sequence`
    "UP031", # Use format specifiers instead of percent format
    "SIM108", # Use ternary operator instead of...
    "PLR2004", # Magic value used in comparison
    "DJ001", # Avoid using `null=True` on string-based fields such as `CharField`

    # todos
    "BLE001", # blind exception
    "S324",  # insecure md5
    "C901",  # too complex
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLW0603"
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.per-file-ignores]
"tests/**.py" = ["S101", "PLR2004", "S", "SIM117", "D", "UP", "PLR0913", "ANN", "N999", "PT006"]
"src/dbtemplates/test**.py" = ["S101", "PLR2004", "S", "SIM117", "D", "UP", "PLR0913", "ANN", "N999", "PT009"]
"src/**/migrations/*.py" = ["E501", ]
"src/**/versioning/**.py" = ["N999", ]
"src/bitcaster/version.py" = ["ALL", ]
"src/bitcaster/models/*.py" = ["ERA001"]
"src/bitcaster/types/*.pyi" = [
    "PLC0105",  # TypeVar` name "..." does not reflect its covariance; consider renaming it to "..."
]
"src/bitcaster/**/*.py" = [
    "A005",  # Module `...` shadows a Python standard-library module"
    "B904",  # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "DJ006",  # Do not use `exclude` with `ModelForm`, use `fields` instead
    "DJ007",  # Do not use `__all__` with `ModelForm`, use `fields` instead
    "ERA001",  # Found commented-out code
    "N816",  # Variable `dispatcherManager` in global scope should not be mixedCase
    "PLW0642",  # Reassigned `cls` variable in `__new__` method
    "S321",  # FTP-related functions are being called. FTP is considered insecure. Use SSH/SFTP/SCP or some other encrypted protocol.
    "SIM102",  # Use a single `if` statement instead of nested `if` statements
]
"src/bitcaster/management/commands/*.py" = [
    "A001",  # Variable `help` is shadowing a Python builtin
]
