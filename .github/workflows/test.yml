---
name: Test

on:
  push:
    branches:
      - develop
  pull_request:
    types: [ synchronize, opened, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  attestations: write
  actions: write


jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    defaults:
      run:
        shell: bash
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
      dockerize: ${{ steps.changes.outputs.dockerize }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - id: changes
      name: Check for file changes
      uses: dorny/paths-filter@v4
      with:
        base: ${{ github.ref }}
        token: ${{ github.token }}
        filters: .github/file-filters.yml

  test:
    needs: [changes]
    if: needs.changes.outputs.run_tests == 'true'
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
        - 16379:6379
      db:
        image: postgres:14
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
        - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      DATABASE_URL: postgres://postgres:postgres@localhost:15432/test
      CACHE_URL: redis://localhost:16379/0
      DRAMATIQ_BROKER: redis://localhost:16379/0
      DOCKER_BUILDKIT: 1
      RUNNER_TOOL_CACHE: /tmp/
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v8.0.0
      with:
        version: latest
        enable-cache: true
        prune-cache: false
        cache-local-path: ./uv-cache
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
        python-version: 3.13.1
        activate-environment: true

    - name: Restore cached vEnv
      id: cache-venv-restore
      uses: actions/cache/restore@v5
      with:
        path: |
          ./uv-cache
          ./tox
        key: ${{ runner.os }}-venv-3.13

    - name: Install dependencies
      run: uv sync --cache-dir ./uv-cache --frozen

    - name: Save vEnv
      id: cache-venv-save
      uses: actions/cache/save@v5
      with:
        path: |
          ./uv-cache
          ./tox
        key: ${{ steps.cache-venv-restore.outputs.cache-primary-key }}

    - name: Run Test suite
      run: |
        uv run tox -e tests

    - name: Archive selenium results
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: selenium-log-report
        path: latest_logs
        retention-days: 5

    - name: Upload test results to Codecov
      uses: codecov/test-results-action@v1
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      continue-on-error: false
      with:
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: false
        name: codecov-${{ github.ref_name }}

    - name: build
      id: build
      run: |
          VERSION=$( uvx --with hatch-vcs hatchling metadata version )
          COMMIT_SHA=$(git rev-parse "$GITHUB_SHA")

          uv build --wheel

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT_SHA" >> $GITHUB_OUTPUT

          echo "::notice title=VERSION:: Build local package $VERSION"
          echo "::notice title=COMMIT:: Build local package $COMMIT_SHA"

  dockerize:
    needs: [changes, test]
    if: needs.changes.outputs.dockerize == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Trigger dockerize workflow
      run: |
        echo "::notice title=Ref::${{github.ref}}"
        echo "::notice title=Tag::${{ github.ref_name }}"
        echo "::notice title=Ver::${{needs.test.outputs.version}}"
        echo "::notice title=Commit::${{needs.test.outputs.commit}}"

        RES=$(curl -X POST \
          --fail-with-body \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/dockerize.yml/dispatches \
          -d '{"ref":"${{ github.ref }}", "inputs": {"git_reference": "${{ needs.test.outputs.commit }}", "tag": "${{ github.ref_name }}"}')
        CURL_EXIT_CODE=$?
        if [[ $CURL_EXIT_CODE -ne 0 ]]; then
          printf "::error::cURL failed %d.\nOutput cURL: %s\n" "$CURL_EXIT_CODE" "$RES"
          exit 1
        fi
        echo "::notice:: API call to 'dockerize.yml' succesed"
