name: 'lock closed issues/PRs'
on:
  schedule:
    - cron: '* */12 * * *'
  workflow_dispatch:
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@1bf7ec25051fe7c00bdd17e6a7cf3d7bfb7dc771 # v5.0.1
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: 15
          issue-lock-reason: ''
          pr-inactive-days: 15
          pr-lock-reason: ''
