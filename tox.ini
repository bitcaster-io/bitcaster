[tox]
requires =
    tox>=4.2
    tox-uv>=1.25
env_list =
    lint
    tests
    mypy
    docs
    pkg_meta

[testenv]
runner = uv-venv-lock-runner
description = run tests
pass_env =
    CACHE_URL
    DATABASE_URL
    DRAMATIQ_BROKER
set_env =
    CRYPT_KEYS = 123
    CRYPT_SALT_KEYS = 123
    PYTHONDONTWRITEBYTECODE = 1
    SECRET_KEY = super-secret-key-just-for-testingset_env =
commands =
    {posargs:pytest \
      tests/ \
      -rw \
      -n auto \
      --dist=loadfile \
      --create-db \
      --junit-xml=junit.xml \
      -o junit_family=legacy \
      --headless}
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:mypy]
runner = uv-venv-lock-runner
description = run mypy type checking
skip_install = false
commands =
    mypy --config-file mypy.ini {posargs:}
dependency_groups = mypy
uv_sync_flags = --no-editable

[testenv:docs]
description = build mkdocs documentation
skip_install = false
deps =
pass_env =
    DYLD_LIBRARY_PATH
commands =
    mkdocs build {posargs:}
dependency_groups = docs

[testenv:pkg_meta]
runner = uv-venv-lock-runner
description = check that python package
skip_install = true
deps =
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.5
commands =
    uv build --sdist -q --out-dir {env_tmp_dir} .
    uvx twine check {env_tmp_dir}{/}*
    uvx check-wheel-contents --ignore W002,W004,W009,W004 {env_tmp_dir}

[testenv:security]
description = run mypy type checking
skip_install = true
commands =
    trivy fs \
      --debug \
      --license-full \
      --format table \
      --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
      --scanners vuln,misconfig,secret,license \
      --list-all-pkgs \
      uv.lock
    bandit -r src/
    uvx pysentry-rs .
allowlist_externals =
    bandit
    docker
    trivy
    uvx
