[tox]
requires =
    tox>=4.2
    tox-uv>=1.25
env_list =
    lint
    semgrep
    tests
    mypy
    docs
    security
    pkg_meta

[testenv]
runner = uv-venv-lock-runner
description = run tests
base_python = py313
pass_env =
    CACHE_URL
    DATABASE_URL
    DRAMATIQ_BROKER
set_env =
    CRYPT_KEYS = 123
    CRYPT_SALT_KEYS = 123
    PYTHONDONTWRITEBYTECODE = 1
    SECRET_KEY = super-secret-key-just-for-testing
commands =
    {posargs:pytest \
      tests/ \
      --create-db \
      -rw \
      -n auto \
      --dist=loadgroup \
      --create-db \
      --junit-xml=junit.xml \
      --no-success-flaky-report \
      -o junit_family=legacy \
      --headless}
    diff-cover coverage.xml --compare-branch=origin/develop --fail-under=100
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:semgrep]
runner = uv-venv-lock-runner
description = run semgrep
skip_install = false
commands =
    semgrep \
      scan \
      --config .semgrep/ \
      --exclude=.semgrep/ \
      --exclude=docs/_scripts/ \
      --error \
      --disable-version-check \
      .
allowlist_externals =
    semgrep
dependency_groups = mypy
uv_sync_flags = --no-editable

[testenv:mypy]
runner = uv-venv-lock-runner
description = run mypy type checking
skip_install = false
commands =
    mypy --config-file mypy.ini {posargs:}
dependency_groups = mypy
uv_sync_flags = --no-editable

[testenv:docs]
description = build mkdocs documentation
skip_install = false
deps =
pass_env =
    DYLD_LIBRARY_PATH
commands =
    properdocs build {posargs:}
dependency_groups = docs

[testenv:security]
description = run mypy type checking
skip_install = true
commands =
    trivy fs \
      --license-full \
      --format table \
      --severity HIGH,CRITICAL \
      --scanners vuln,misconfig,secret,license \
      --list-all-pkgs \
      uv.lock
    bandit -c bandit.yaml -r src/
    uvx pysentry-rs . --fail-on high --compact --display table
    pip-audit -l --skip-editable --aliases
allowlist_externals =
    bandit
    docker
    trivy
    uvx

[testenv:pkg_meta]
runner = uv-venv-lock-runner
description = check that python package
skip_install = true
deps =
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.5
commands =
    uv build --sdist -q --out-dir {env_tmp_dir} .
    uvx twine check {env_tmp_dir}{/}*
    uvx check-wheel-contents --ignore W002,W004,W009,W004 {env_tmp_dir}

[testenv:docs-test]
description = build documentation and check links
skip_install = false
pass_env =
    DYLD_LIBRARY_PATH
set_env =
    CACHE_URL = redis://localhost:6379/0
    DATABASE_URL = sqlite:////tmp/bitcaster-docs-test.db
    DRAMATIQ_BROKER = redis://localhost:6379/0
    RUN_DOCS_TESTS = 1
commands =
    pytest tests/docs/ --no-cov {posargs:}
dependency_groups = docs, dev
