repos:
  -   repo: https://github.com/astral-sh/ruff-pre-commit
      rev: "v0.9.9"
      hooks:
          -   id: ruff-format
          -   id: ruff
              args: [ "--fix", "--unsafe-fixes", "--exit-non-zero-on-fix" ]

  -   repo: https://github.com/tox-dev/tox-ini-fmt
      rev: "1.5.0"
      hooks:
          -   id: tox-ini-fmt
              args: [ "-p", "lint" ]

  -   repo: https://github.com/tox-dev/pyproject-fmt
      rev: "v2.5.1"
      hooks:
          -   id: pyproject-fmt

  - repo: local
    hooks:
      - id: mypy
        exclude: (^~.*|manage\.py|develop\.py|conftest.py)
        args: [ "--config-file", ".mypy.ini" ]
        require_serial: true
        name: mypy
        entry: mypy
        language: python
        types: [ python ]
        stages: [ commit ]
        additional_dependencies: [packaging]

#      - id: mypy
#        exclude: (^~.*|manage\.py|develop\.py|conftest.py)
#        args: [ "--config-file", ".mypy.ini" ]
#        require_serial: true
#        name: mypy
#        entry: mypy
#        language: python
#        types: [ python ]
#        stages: [ commit ]
#        additional_dependencies: [
#          "django-stubs",
#          "django-stubs-ext",
#          "mypy-boto3",
#          "mypy-boto3-sns",
#          "boto3-stubs",
#          "types-freezegun",
#          "types-markdown",
#          "types-python-dateutil",
#          "types-redis",
#          "types-requests",
#          "types-s3transfer",
#        ]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [ '--baseline', '.secrets.baseline' ]
        exclude: (tests/.*|.*/tenant\.sql|Pipfile\.lock|.*\.js|~.gitlab-ci.yml|poetry.lock)
        stages: [ push ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: debug-statements
        stages: [ commit ]

      - id: end-of-file-fixer
        exclude: .bumpversion.cfg
        stages: [ commit ]

      - id: check-merge-conflict
        stages: [ commit ]

      - id: check-case-conflict
        stages: [ commit ]

  - repo: https://github.com/saxix/pch
    rev: '0.1'
    hooks:
      - id: check-missed-migrations
        args:
          - src
        stages: [ commit ]
        additional_dependencies: [ setuptools ]

      - id: check-untracked
        args:
          - src
          - tests
        stages: [ push ]

      - id: check-forbidden
        args:
          - -p
          - /\.showbrowser\(/
          - -p
          - /print\(111/
        stages: [ commit ]
        additional_dependencies: [ setuptools ]

  - repo: https://github.com/PyCQA/bandit
    rev: '1.7.9' # Update me!
    hooks:
      - id: bandit
        args: [ "-c", "bandit.yaml" ]
