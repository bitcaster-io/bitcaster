
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace


  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
    -   id: djlint-reformat
        args: ["--configuration", "djlint.toml"]


  - repo: https://github.com/twisted/towncrier
    rev: 24.8.0
    hooks:
      - id: towncrier-check

  - repo: https://github.com/tox-dev/tox-ini-fmt
    rev: "e732f664aa3fd7b32cce3de8abbac43f4c3c375d"  # frozen: 1.5.0
    hooks:
      - id: tox-ini-fmt
        args: [ "-p", "lint" ]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "57b6ff7bf72affdd12c7f3fd6de761ba18a33b3a"  # frozen: v2.5.1
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
      - id: ruff-format
        args:
          - --check

  - repo: https://github.com/saxix/pch
    rev: '0.6'
    hooks:
      - id: check-missed-migrations
        args:
          - src
        stages: [ pre-commit ]
        additional_dependencies: [ setuptools ]

      - id: check-untracked
        args:
          - src
          - tests
        stages: [ pre-push ]

      - id: check-tailwind
        name: check tailwind CSS ready for production
        files: src/bitcaster/web/theme/static_src/src/.*\.scss
        args:
          - -d
          - src/bitcaster/web/static/css/

      -   id: check-minimized
          name: check missing minimized javascript
          files: (\.js)$
          exclude: (\.min\.js)$
          args:
            - -i
            - "docs/*"
            - -i
            - "@node_modules/.*"
            - -i
            - '@.*postcss\.config\.js'
            - -i
            - '@.*tailwind\.config\.js'

      - id: check-forbidden
        name: check pyproject to avoid editable sources/deps
        files: pyproject.toml
        language: python
        args:
          - -p
          - /\[tool\.uv\.sources\]\s/s
