[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "bitcaster"
description = ""
readme = "README.md"
license = { text = "OS4D" }

authors = [
  { name = "Bitcaster Team", email = "info@bitcaster.io" },
]
requires-python = "==3.13.*"
classifiers = [ "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.13" ]
dynamic = [ "version" ]

