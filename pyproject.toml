  "python-magic>=0.4.27",
  "pywebpush>=2",
  "qrcode>=7.4.2",
  "requests>=2.33.1",
  "requests-oauthlib>=2",
  "sentry-sdk>=1.43",
  "setuptools>=75.3",
  "slack-sdk>=3.27.1",
  "sqlparse>=0.6",
