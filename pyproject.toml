  "apscheduler>=3.11.2",
  "click>=8.3.1",
  "colorlog>=6.10.1",
  "cron-descriptor>=2.0.6",
  "cryptography>=48.0.1",
  "django>=5.2.15,<6",
  "django-ace>=1.43.5",
  "django-admin-extra-buttons>=2.1.1",
  "django-adminactions>=2.3",
