rules:
  - id: django-field-verbose-name-required
    languages:
      - python
    severity: WARNING
    message: Django model fields should explicitly define `verbose_name`.
    patterns:
      - pattern-inside: |
          class $MODEL(...):
            ...
      - pattern-not-inside: |
          class Meta:
            ...
      - pattern-either:
          - pattern: $FIELD_NAME = models.$F(...)
          - pattern: $FIELD_NAME = $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: .*Field$
      - pattern-not: $FIELD_NAME = $ANY(..., verbose_name=..., ...)
    paths:
      include:
        - "**/models.py"
        - "**/models/*.py"

  - id: django-field-help-text-required
    languages:
      - python
    severity: WARNING
    message: Django model fields should explicitly define `help_text`.
    patterns:
      - pattern-inside: |
          class $MODEL(...):
            ...
      - pattern-not-inside: |
          class Meta:
            ...
      - pattern-either:
          - pattern: $FIELD_NAME = models.$F(...)
          - pattern: $FIELD_NAME = $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: .*Field$
      - pattern-not: $FIELD_NAME = $ANY(..., help_text=..., ...)
    paths:
      include:
        - "**/models.py"
        - "**/models/*.py"

  - id: django-field-verbose-name-gettext
    languages:
      - python
    severity: WARNING
    message: Django model field `verbose_name` must use `_("...")`.
    patterns:
      - pattern-inside: |
          class $MODEL(...):
            ...
      - pattern-either:
          - pattern: $FIELD_NAME = models.$F(..., verbose_name=$VALUE, ...)
          - pattern: $FIELD_NAME = $F(..., verbose_name=$VALUE, ...)
      - metavariable-regex:
          metavariable: $F
          regex: .*Field$
      - pattern-not:
          pattern: $FIELD_NAME = $ANY(..., verbose_name=_("..."), ...)
    paths:
      include:
        - "**/models.py"
        - "**/models/*.py"

  - id: django-field-help-text-gettext
    languages:
      - python
    severity: WARNING
    message: Django model field `help_text` must use `_("...")`.
    patterns:
      - pattern-inside: |
          class $MODEL(...):
            ...
      - pattern-either:
          - pattern: $FIELD_NAME = models.$F(..., help_text=$VALUE, ...)
          - pattern: $FIELD_NAME = $F(..., help_text=$VALUE, ...)
      - metavariable-regex:
          metavariable: $F
          regex: .*Field$
      - pattern-not:
          pattern: $FIELD_NAME = $ANY(..., help_text=_("..."), ...)
    paths:
      include:
        - "**/models.py"
        - "**/models/*.py"
