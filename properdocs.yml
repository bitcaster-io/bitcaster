copyright: Copyright &copy; 2020-2026 OS4D ltd.
dev_addr: 127.0.0.1:8001
docs_dir: docs
edit_uri: 'blob/develop/docs/'
repo_url: https://github.com/bitcaster-io/bitcaster
site_author: Bitcaster Team
site_description: "The multichannel broker for managing corporate messaging"
site_dir: ./~build/docs
site_name: Bitcaster
site_url: https://bitcaster-io.github.io/bitcaster/
strict: false
extra_css:
  - _theme/css/style.css
extra_javascript:
  - _theme/js/js.cookie.js
  - _theme/js/address.js
exclude_docs: |
  ~*
  .m_templates
  .templates
  _scripts
  _guidelines


markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: '.'
      check_paths: true
  - tables
  - toc:
      permalink: #
      baselevel: 1


extra:
  generator: true
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bitcaster-io
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/bitcaster/bitcaster

theme:
  name: "material"
  color_mode: auto
  custom_dir: docs/_theme/overrides
  favicon: _theme/img/favicon.ico
  logo: _theme/img/logo.png
  user_color_mode_toggle: true
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: red
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: red
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-night
        name: Switch to light mode


plugins:
  - autorefs
  - awesome-pages
  - ezglossary:
      templates: docs/_theme/glossary
      inline_refs: short
      list_definitions: true
      list_references: true
  - link-marker
  - macros
  - redirects:
      redirect_maps:
        'help/channel.md': 'glossary/terms/channel.md'
#        'some_file.md': 'http://external.url.com/foobar'
  - include-markdown:
      encoding: ascii
      preserve_includer_indent: false
      dedent: false
      trailing_newlines: true
      comments: false
      rewrite_relative_urls: true
      heading_offset: 0
      recursive: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
  - privacy
  - search
  - social
  - tags

watch:
  - docs/

hooks:
  - docs/_hooks/hooks.py
