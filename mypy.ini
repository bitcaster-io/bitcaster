[mypy]
python_version = 3.13
files = src/
exclude = (?x)(management/|manage.py)
install_types = true
show_error_codes = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs/:$MYPY_CONFIG_FILE_DIR/src/:"
strict = true
ignore_missing_imports = True
namespace_packages = true
plugins =
    mypy_django_plugin.main


[mypy-bitcaster.admin.*]
ignore_errors = True

[mypy-bitcaster.api.*]
ignore_errors = True


[mypy-bitcaster.cli.*]
ignore_errors = True
disable_error_code = untyped-decorator

[mypy-bitcaster.social.*]
ignore_errors = True

[mypy-bitcaster.utils.flags]
ignore_errors = True
disable_error_code = untyped-decorator

[mypy-bitcaster.*]
disable_error_code = type-var, attr-defined, truthy-function, union-attr, var-annotated, valid-type, misc, attr-defined, no-any-return, return
follow_imports = skip
ignore_missing_imports = True


[mypy-admin_extra_buttons.*]
ignore_missing_imports = True

[mypy-adminactions.*]
ignore_missing_imports = True

[mypy-adminfilters.*]
ignore_missing_imports = True

[mypy-django.*]
ignore_missing_imports = True

[mypy-dramatiq.*]
ignore_missing_imports = True

[mypy-environ.*]
ignore_errors = True

[mypy.factory.*]
ignore_missing_imports = True

[mypy-flags.*]
ignore_missing_imports = True

[mypy-power_query.*]
ignore_errors = True

[mypy-strategy_field.*]
ignore_errors = True

[mypy.plugins.django-stubs]
django_settings_module = "bitcaster.config.settings"
